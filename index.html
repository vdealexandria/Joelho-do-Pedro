<style>

--c-healthy:#5fd18c;--c-healthy-f:rgba(95,209,140,.2);--c-rebuilt:#7fb0ff;--c-rebuilt-f:rgba(90,150,255,.3);--c-repaired:#ff9a4d;--c-repaired-f:rgba(255,154,77,.3);--c-partial:#ffd84d;--c-partial-f:rgba(255,216,77,.3);--c-removed:#b4bac3;--c-removed-f:rgba(180,186,195,.25);--c-scar:#c9a0ff;--c-scar-f:rgba(201,160,255,.25);--c-implant:#9db8ff;--c-implant-f:rgba(120,150,255,.5);--c-torn:#ff7aa8;--c-torn-f:rgba(255,122,168,.25);--glow:#ffb066;--halo:#172428}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}

.sh.st-implant{fill:var(--c-implant-f);stroke:var(--c-implant);stroke-width:3.5}.sh.st-torn{fill:url(#pTorn);stroke:var(--c-torn);stroke-width:2.5}
.ln.st-healthy{stroke:var(--c-healthy)}.ln.st-rebuilt{stroke:var(--c-rebuilt)}.ln.st-repaired{stroke:var(--c-repaired);stroke-dasharray:7 4}.ln.st-partial{stroke:var(--c-partial);stroke-dasharray:2 6}
.ln.st-removed{stroke:var(--c-removed);stroke-dasharray:10 5}.ln.st-scar{stroke:var(--c-scar);stroke-dasharray:1 7}.ln.st-implant{stroke:var(--c-implant)}.ln.st-torn{stroke:var(--c-torn);stroke-dasharray:4 12}

.sh.ghost{fill:none!important;stroke:var(--muted)!important;stroke-dasharray:4 4}
.stitch{fill:none;stroke:var(--c-repaired);stroke-width:2.2;stroke-linecap:round;pointer-events:none}
.lab{font:700 11px var(--f-body);fill:var(--ink);paint-order:stroke;stroke:var(--halo);stroke-width:3.5px;stroke-linejoin:round;pointer-events:none}
.ic{font:12px var(--f-body);pointer-events:none;fill:var(--ink)}.ic.w{fill:#fff}
.insetbg{fill:var(--paper);stroke:var(--line)}.plateau{fill:none;stroke:var(--muted);stroke-dasharray:3 3}

.legend{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;font-size:.85rem}.legend div{display:flex;gap:8px;align-items:center}.legend small{color:var(--muted);display:block;line-height:1.1}

.cmp .tagl,.cmp .tagr{position:absolute;top:6px;font-size:.75rem;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:1px 6px;z-index:2}.tagl{left:6px}.tagr{right:6px}
input[type=range]{width:100%;height:36px;accent-color:var(--brand)}
input[type=text],input[type=number],input[type=date],select,textarea{width:100%;min-height:44px;padding:8px 10px;border:2px solid var(--line);border-radius:10px;background:var(--paper)}
textarea{min-height:80px}
label.f{display:block;margin:8px 0;font-weight:700;font-size:.92rem}label.f>*:not(span){font-weight:400;margin-top:4px}
.task{border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin:10px 0;background:var(--paper)}.task.done{background:var(--ok-bg);border-color:var(--c-healthy)}
.task h3{margin:0;font-size:1.02rem;flex:1}.th{display:flex;gap:8px;align-items:flex-start}.th .ico{font-size:1.5rem;line-height:1.2}
.cnt{font-weight:700;white-space:nowrap}
.chk{min-width:56px;min-height:48px;border:2px solid var(--brand);border-radius:12px;background:var(--paper);font-weight:700}.chk[aria-pressed=true]{background:var(--brand);color:var(--brand-ink)}
details{margin:6px 0}summary{cursor:pointer;font-weight:700;min-height:36px;padding:6px 0}
.alert{border-radius:12px;padding:10px 12px;margin:10px 0}.alert.red{background:var(--danger-bg);color:var(--danger);border:2px solid var(--danger)}.alert.warn{background:var(--warn-bg);color:var(--warn);border:2px solid var(--warn)}
.day{display:grid;grid-template-columns:62px 1fr auto;gap:8px;align-items:center;width:100%;text-align:left;padding:10px;border:2px solid var(--line);border-radius:12px;background:var(--paper);margin:6px 0;min-height:60px}
.day.today{border-color:var(--brand);box-shadow:0 0 0 3px var(--soft)}.day b{font-family:var(--f-head)}
.bar{height:16px;border-radius:10px;background:var(--soft);overflow:hidden;border:1px solid var(--line)}.bar i{display:block;height:100%;background:repeating-linear-gradient(45deg,var(--brand),var(--brand) 8px,color-mix(in srgb,var(--brand) 75%,#fff) 8px,color-mix(in srgb,var(--brand) 75%,#fff) 16px)}
.bdg{display:flex;gap:10px;align-items:flex-start;padding:8px;border:1px dashed var(--line);border-radius:12px;margin:6px 0}.bdg.on{border-style:solid;border-color:var(--c-healthy);background:var(--ok-bg)}.bdg .ico{font-size:1.8rem;filter:grayscale(1);opacity:.5}.bdg.on .ico{filter:none;opacity:1}
.mstone{display:flex;gap:10px;align-items:center;padding:8px;border-left:5px solid var(--line);margin:6px 0;background:var(--paper);border-radius:0 10px 10px 0}.mstone.got{border-color:var(--c-healthy)}.mstone.rel{border-color:var(--c-rebuilt)}
.no{display:flex;gap:10px;padding:10px;border:2px solid var(--danger);border-radius:12px;margin:8px 0;background:var(--paper)}.no .ico{font-size:1.6rem}
.rows{list-style:none;padding:0;margin:8px 0}.rows li{display:grid;grid-template-columns:130px 52px 1fr;gap:6px;align-items:center;padding:4px 0;border-bottom:1px dotted var(--line);font-size:.88rem}
.lv{display:flex;gap:2px}.lv i{width:12px;height:12px;border:1px solid var(--ink);border-radius:3px}.lv i.on{background:var(--ink)}
.fab{position:fixed;right:12px;bottom:calc(74px + env(safe-area-inset-bottom));z-index:30;background:var(--danger);color:#fff;border:2px solid #fff;border-radius:999px;min-height:48px;padding:8px 16px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.35)}
:root[data-theme=dark] .fab{background:#b3261e}
nav.bot{position:fixed;left:0;right:0;bottom:0;z-index:25;display:grid;grid-template-columns:repeat(4,1fr);background:var(--paper);border-top:2px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.bot button{border:0;background:none;min-height:62px;padding:6px 2px;font-size:.78rem;font-weight:700;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
nav.bot button span{font-size:1.35rem;line-height:1}nav.bot button[aria-current=page]{color:var(--brand);box-shadow:inset 0 4px 0 var(--brand)}
dialog{border:0;border-radius:20px;max-width:min(680px,96vw);width:100%;max-height:92vh;padding:16px;background:var(--paper);color:var(--ink);box-shadow:0 10px 40px rgba(0,0,0,.4)}
dialog::backdrop{background:rgba(0,0,0,.55)}
.stbox{display:flex;align-items:center;gap:8px;margin:6px 0}
.qrow{display:grid;grid-template-columns:34px 1fr auto;gap:8px;align-items:start;margin:8px 0}.qrow input[type=checkbox]{width:28px;height:28px;margin-top:10px}
.note{border-left:4px solid var(--brand);padding:4px 10px;margin:6px 0;background:var(--soft);border-radius:0 8px 8px 0}
table.t{border-collapse:collapse;width:100%;font-size:.85rem}table.t td,table.t th{border:1px solid var(--line);padding:3px 6px;text-align:left}
@media(min-width:700px){.legend{grid-template-columns:repeat(4,1fr)}}
@media(max-width:380px){.rows li{grid-template-columns:100px 50px 1fr}.resumo b{font-size:1.5rem}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}.hl .sh,.hl .ln{stroke-width:6}}
</style>

<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs>
<pattern id="pRem" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" style="fill:var(--c-removed-f)"/><line x1="0" y1="0" x2="0" y2="7" style="stroke:var(--c-removed);stroke-width:2.4"/></pattern>
<pattern id="pScar" width="7" height="7" patternUnits="userSpaceOnUse"><rect width="7" height="7" style="fill:var(--c-scar-f)"/><circle cx="3.5" cy="3.5" r="1.7" style="fill:var(--c-scar)"/></pattern>
<pattern id="pTorn" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" style="fill:var(--c-torn-f)"/><path d="M0 0L8 8M8 0L0 8" style="stroke:var(--c-torn);stroke-width:1.5"/></pattern>
<pattern id="pRed" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#fff"/><rect width="4" height="8" fill="#c62828"/></pattern>
</defs></svg>
<header class="top"><h1>Meu joelho<span class="sub">Joelho esquerdo · pós-cirurgia de menisco</span></h1><button class="chip" id="theme" aria-label="Alternar modo claro e escuro">🌓 Tema</button></header>

<button data-nav="hist"><span aria-hidden="true">🕰️</span>Histórico</button>

<script>
(function(){'use strict';
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* ===== datas ===== */
const pad=n=>String(n).padStart(2,'0'),ds=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pd=s=>{const a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2])};
const today=()=>ds(new Date()),addDays=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return ds(d)};
const diff=(a,b)=>Math.round((pd(b)-pd(a))/864e5),br=s=>{const a=s.split('-');return a[2]+'/'+a[1]+'/'+a[0]};
const WD=['dom','seg','ter','qua','qui','sex','sáb'],wd=s=>WD[pd(s).getDay()],START='2026-10-24';
/* ===== dados e armazenamento ===== */
const KEY='joelho-app-v1';let mem=null;
function defaults(){return{v:1,theme:null,
plan:{surgery:'2026-10-09',returnVisit:'2026-10-30',returnOk:false,waitFrom:'2026-11-16',afterText:'Aguardando orientação do médico',
flex:[{from:'2026-10-23',max:30,ok:true},{from:'2026-11-02',max:60,ok:false},{from:'2026-11-09',max:90,ok:false}],
weight:'Pode apoiar de leve SOMENTE com o imobilizador. Nunca apoiar o pé sem o imobilizador.',weightOk:false,
pending:[{t:'Apoio de carga (quando e quanto)',ok:false},{t:'Retirada do restante dos pontos',ok:false},{t:'Retirada do imobilizador',ok:false},{t:'Profilaxia de trombose (remédio)',ok:false},{t:'Início da fisioterapia',ok:false},{t:'Liberação para dirigir e trabalhar',ok:false}]},
times:{ext:3,quad:4,flex:3,ankle:4,ice:4,dress:1,imob:2,meds:1,reg:1},iceMin:20,timesOk:false,logs:{},mapState:{},
questions:['Quando posso apoiar com carga e quanto?','Quando tiram o restante dos pontos?','Quando tiro o imobilizador?','Preciso de remédio para trombose?','Qual técnica de sutura foi usada e qual é o protocolo completo?','A banda do LCA foi tratada?','Há alguma restrição por causa da cirurgia de Lemaire?','Quando posso dirigir, trabalhar e começar a fisioterapia?','Corrigir no sumário de alta o ano da reconstrução do LCA (foi 2023, não 2024).'].map(t=>({t,a:'',done:false}))}}
function norm(o){const d=defaults();if(!o||typeof o!=='object')return d;
return Object.assign({},d,o,{plan:Object.assign({},d.plan,o.plan||{}),times:Object.assign({},d.times,o.times||{}),logs:(o.logs&&typeof o.logs==='object')?o.logs:{},mapState:(o.mapState&&typeof o.mapState==='object')?o.mapState:{},questions:Array.isArray(o.questions)?o.questions:d.questions})}
let S;try{S=norm(JSON.parse(localStorage.getItem(KEY)||'null'))}catch(e){S=defaults()}
function save(){const j=JSON.stringify(S);mem=j;try{localStorage.setItem(KEY,j)}catch(e){}}
/* ===== plano ===== */
function limitFor(d){const st=S.plan.flex.filter(x=>x.from).sort((a,b)=>a.from<b.from?-1:1);let c=st[0]||{max:0,ok:false};for(const x of st)if(x.from<=d)c=x;return{max:+c.max||0,ok:!!c.ok,waiting:!!S.plan.waitFrom&&d>=S.plan.waitFrom}}
const badge=ok=>ok?'<span class="badge ok">confirmado</span>':'<span class="badge">confirmar com o médico</span>';
const AV='Siga sempre o que seu cirurgião e seu fisioterapeuta mandarem. Em caso de dúvida, pergunte a eles.';
const aviso=()=>`<p class="aviso" role="note">⚠️ ${AV}</p>`;
const foot=()=>'<p class="foot">Material educativo. Não substitui orientação médica.</p>';
/* ===== tarefas ===== */
const T=[
{id:'ext',ic:'🦵',n:'Estender o joelho por completo (meta: 0°, joelho reto)',mv:'ext',
how:['Deite de costas, com a perna apoiada só pelo calcanhar.','Deixe o joelho livre, sem nada embaixo dele.','Relaxe e deixe o peso da perna esticar o joelho.','Sem empurrar com as mãos e sem dor forte.'],
why:'A cicatriz de 1,2 cm na frente do LCA pode travar os últimos graus. Perder a extensão atrapalha o andar por anos.',care:'Não force. Se a dor for forte, pare e avise o fisioterapeuta.'},
{id:'quad',ic:'💪',n:'Contração do quadríceps (apertar a coxa, 5 segundos)',mv:'quad',
how:['Fique deitado, com a perna esticada.','Aperte a coxa e empurre o joelho para baixo.','Segure 5 segundos e solte.','Repita várias vezes, respirando normalmente.'],
why:'Evita que o músculo da frente da coxa "apague", sem mexer o joelho.',care:'O joelho não se mexe. Se doer forte, pare.'},
{id:'flex',ic:'📐',n:'Dobrar o joelho até o limite do dia',mv:'flex',

const TM=Object.fromEntries(T.map(t=>[t.id,t]));
const cnt=(t,d)=>{const l=S.logs[d]||{};return(l.done&&l.done[t])||0};
function tDone(t,d){const l=S.logs[d]||{};if(t.id==='reg')return l.pain!=null&&l.swell!=null;return cnt(t.id,d)>=(S.times[t.id]||1)}
const overDay=d=>{const l=S.logs[d]||{};return l.angle!=null&&l.angle>limitFor(d).max};
function dayInfo(d){const done=T.filter(t=>tDone(t,d)).length,over=overDay(d);let pts=0;T.forEach(t=>{if(tDone(t,d)&&!(t.id==='flex'&&over))pts+=10});const all=done===T.length;if(all&&!over)pts+=30;return{done,total:T.length,over,all,ok:all&&!over,pts}}
function allDays(){const a=[],t=today();for(let d=START;d<=t;d=addDays(d,1))a.push(d);return a}
function runMax(pred){let m=0,r=0;allDays().forEach(d=>{if(pred(d)){r++;m=Math.max(m,r)}else r=0});return m}
function totals(){let pts=0;Object.keys(S.logs).forEach(d=>{pts+=dayInfo(d).pts});let st=0,d=today();if(!dayInfo(d).ok)d=addDays(d,-1);while(d>=START&&dayInfo(d).ok){st++;d=addDays(d,-1)}return{pts,st}}

tibia:['Tíbia (osso da perna)','Osso principal da perna. Forma a parte de baixo da articulação, o "planalto".','Saudável. Teve contusão em 2023, que resolveu. Tem a sequela de Osgood-Schlatter, da adolescência.','O parafuso que prende o enxerto do LCA (2023) está nela.','Evite pancadas na frente do joelho e da perna.'],
fibula:['Fíbula','Osso fino do lado de fora da perna. Segura o ligamento colateral lateral.','Saudável.','Nada foi feito.','Evite apertar ou bater na parte de cima, do lado de fora da perna.'],
patela:['Patela (rótula)','Funciona como uma polia: ajuda o quadríceps a esticar o joelho.','Pequeno desgaste na cartilagem (grau II em 2023, grau I em 2026). O sulco onde ela desliza é mais raso que o normal (sulco "displásico") e ela fica um pouco alta ("patela alta"). Isso deixa a frente do joelho mais sensível.','Em 2023 foi feita uma limpeza da cartilagem (condroplastia).','Evite agachar fundo e ajoelhar. Dor na frente do joelho: avise o fisioterapeuta.'],
osgood:['Tuberosidade da tíbia (Osgood-Schlatter)','É o ponto da tíbia onde o tendão da patela se prende.','Tem a sequela de Osgood-Schlatter, uma inflamação da adolescência que deixou um "calombo".','Nada foi feito.','Evite ajoelhar e bater ali. Pode doer ao apoiar.'],
cartilagem:['Cartilagem','Camada lisa que cobre as pontas dos ossos. Deixa o joelho deslizar sem atrito.','Preservada. Só há um pequeno desgaste na patela.','Em 2023, limpeza da cartilagem da patela.','Mexer o joelho dentro do limite ajuda a cartilagem a se nutrir.'],
menMed:['Menisco medial (do lado de dentro)','É uma almofada em forma de "C". Absorve impacto e estabiliza o joelho.','Parte foi retirada em 2023. Em 2026 teve uma lesão em "alça de balde": um grande pedaço soltou e foi para o meio do joelho.','Foi recolocado e COSTURADO em 09/10/2026, com pontos internos. Está em cicatrização.','É a estrutura mais importante a proteger agora. Respeite o limite de dobra, não gire o corpo com o pé no chão, não agache fundo, não sente sobre os calcanhares e não faça força com a parte de trás da coxa antes da liberação.'],

lca:['LCA (ligamento cruzado anterior)','Impede a tíbia de escorregar para frente e ajuda a controlar o giro.','Rompeu em 2023 e foi reconstruído em 03/08/2023 com tendões da parte de trás da coxa (semitendíneo e grácil). Em 2026 a ressonância mostra o enxerto íntegro. Na cirurgia de 2026 foi descrita uma lesão parcial, com uma banda rompida.','Em 2026 não houve procedimento no LCA.','Evite giros. Estender o joelho por completo é importante. Pergunte ao médico sobre a banda rompida.'],

function mvLevels(mode,a){const L={};
L.men=a<15?[0,'quase sem pressão']:a<45?[1,'levemente pressionado por trás']:a<=90?[2,'pressionado por trás']:[3,'muito pressionado (fora do permitido)'];
L.lca=a<=10?[1,'tensionado de leve']:[0,'pouco tensionado'];
L.lcp=a<30?[0,'relaxado']:a<60?[1,'começando a tensionar']:[2,'tensionado'];
L.itb=a<=20?[1,'levemente tensionado']:[0,'relaxado'];
L.pat=a<20?[0,'pouco apertada']:a<60?[1,'entrando no sulco']:[2,'pressionada no sulco'];
L.quad=mode==='quad'?[2,'contraído, trabalhando']:a<45?[0,'relaxado']:[1,'alongado'];
L.isq=[0,'relaxados (não force)'];return L}
function mvHTML(mode,a,lim){const K={x:190,y:150},R=120,rad=Math.PI/180,L=mvLevels(mode,a);
const P=th=>[K.x+R*Math.sin(th*rad),K.y+R*Math.cos(th*rad)];
const rot=(x,y,ang)=>{const c=Math.cos(ang*rad),s=Math.sin(ang*rad);return[K.x+x*c-y*s,K.y+x*s+y*c]};
const arc=(a0,a1,st,w)=>{const p=P(a0),q=P(a1);return`<path d="M${p[0].toFixed(1)} ${p[1].toFixed(1)} A${R} ${R} 0 0 0 ${q[0].toFixed(1)} ${q[1].toFixed(1)}" fill="none" stroke="${st}" stroke-width="${w}"/>`};
const col=l=>['var(--c-healthy)','var(--c-partial)','var(--c-repaired)','#d0143c'][l];
const ln=(p,q,l,w)=>`<line x1="${p[0].toFixed(1)}" y1="${p[1].toFixed(1)}" x2="${q[0].toFixed(1)}" y2="${q[1].toFixed(1)}" stroke="${col(l)}" stroke-width="${w}" stroke-linecap="round" ${l>=2?'stroke-dasharray="1 0"':''}/>`;
const th=-a*.55*rad,pp=[K.x+(-40*Math.cos(th)+4*Math.sin(th)),K.y+(-40*Math.sin(th)-4*Math.cos(th))];
const tub=rot(-22,46,-a),acT=rot(-6,8,-a),lcT=rot(14,10,-a),itT=rot(-14,16,-a),hamT=rot(18,16,-a);

const arrow=a>=15?`<path d="M ${K.x+54} ${K.y+12} L ${K.x+32} ${K.y+12}" stroke="${col(L.men[0])}" stroke-width="3" marker-end="url(#ar)"/><text class="lab" x="${K.x+56}" y="${K.y+8}">pressão</text>`:'';

${mode==='flex'?arc(0,Math.max(lim,0.01),'var(--c-healthy)',12)+(lim<135?arc(lim,135,'url(#pRed)',12):'')+`<text class="lab" x="${out(pg)[0]}" y="${out(pg)[1]}" text-anchor="start">✔ PERMITIDO</text>`+(lim<120?`<text class="lab" x="${out(pr)[0]-4}" y="${out(pr)[1]}" text-anchor="start" style="fill:var(--danger)">✖ PROIBIDO</text>`:''):''}
<rect x="${K.x-20}" y="0" width="40" height="${K.y}" rx="12" fill="var(--c-healthy-f)" stroke="var(--c-healthy)" stroke-width="2"/><circle cx="${K.x}" cy="${K.y}" r="30" fill="var(--c-healthy-f)" stroke="var(--c-healthy)" stroke-width="2"/><text class="lab" x="${K.x-60}" y="40" text-anchor="end">Fêmur</text>
<g transform="rotate(${-a} ${K.x} ${K.y})"><rect x="${K.x-18}" y="${K.y+8}" width="36" height="215" rx="12" fill="var(--c-healthy-f)" stroke="var(--c-healthy)" stroke-width="2"/><rect x="${K.x-26}" y="${K.y+4}" width="52" height="12" rx="6" fill="var(--c-healthy-f)" stroke="var(--c-healthy)" stroke-width="2"/><circle cx="${K.x}" cy="${K.y+228}" r="9" fill="var(--c-implant)"/><text class="lab" x="${K.x+14}" y="${K.y+200}" transform="rotate(${a} ${K.x+14} ${K.y+200})">Tíbia</text></g>
<rect x="${K.x-42}" y="40" width="26" height="${K.y-60}" rx="8" fill="${col(L.quad[0])}" opacity=".35" stroke="${col(L.quad[0])}" stroke-width="${mode==='quad'?4:2}"/><text class="lab" x="${K.x-48}" y="90" text-anchor="end">Quadríceps</text>
${ln([K.x+6,40],itT,L.itb[0],4)}${ln([K.x+30,60],hamT,L.isq[0],4)}
${ln([K.x+14,K.y-14],acT,L.lca[0],6)}${ln([K.x-12,K.y-12],lcT,L.lcp[0],5)}

<text class="lab" x="${K.x+6}" y="${K.y-48}">LCA</text></svg>`;
const names=[['men','Menisco medial (costurado)'],['lca','Enxerto do LCA'],['lcp','LCP'],['itb','Trato iliotibial'],['pat','Patela no sulco'],['quad','Quadríceps'],['isq','Isquiotibiais']];
const rows=names.map(n=>{const q=L[n[0]];return`<li><span>${n[1]}</span><span class="lv" aria-hidden="true"><i class="${q[0]>0?'on':''}"></i><i class="${q[0]>1?'on':''}"></i><i class="${q[0]>2?'on':''}"></i></span><span>${q[1]}</span></li>`}).join('');
let cap;if(mode==='quad')cap='Aqui o joelho fica parado e só o músculo da coxa trabalha. Assim ele não "apaga".';
else if(a<=10)cap='No 0° o foco é esticar o joelho por completo. O enxerto do LCA fica tensionado de leve e a cicatriz na frente dele é alongada. O menisco costurado quase não é pressionado.';
